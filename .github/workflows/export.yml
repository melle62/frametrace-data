name: Export

# Daily: publish what Frametrace users shared since the last run on the `data` branch.
# Also runs when the export itself changes on main, so a fix is tried right away.
on:
  schedule:
    - cron: "23 2 * * *" # 02:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/export.yml", "tools/**", "tests/**"]

permissions:
  contents: write # push the data branch, create the monthly CSV releases
  id-token: write # the OIDC token the Frametrace inbox checks (no stored secret)

concurrency:
  group: export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the export script
        run: pip install -q pytest && python -m pytest -q tests
      - name: Export
        run: python tools/export.py
        env:
          GH_TOKEN: ${{ github.token }}
